```yaml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: npm test

      - name: Update CI status on dashboard
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PIPELINE_STATUS_TOKEN: ${{ secrets.PIPELINE_STATUS_TOKEN }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          APP_URL: https://cicd-pipeline-app-u7ov.onrender.com
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            CI_STATUS="done"
          else
            CI_STATUS="failed"
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            -X POST "$APP_URL/api/pipeline/status" \
            -H "Authorization: Bearer $PIPELINE_STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"stages\":[\"done\",\"pending\",\"$CI_STATUS\",\"pending\",\"pending\"]}"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: prabhas18/cicd-pipeline-app:latest

      - name: Update container and registry status
        if: always()
        env:
          PIPELINE_STATUS_TOKEN: ${{ secrets.PIPELINE_STATUS_TOKEN }}
          BUILD_OUTCOME: ${{ steps.build_push.outcome }}
          APP_URL: https://cicd-pipeline-app-u7ov.onrender.com
        run: |
          if [ "$BUILD_OUTCOME" = "success" ]; then
            CONTAINER_STATUS="done"
            REGISTRY_STATUS="done"
          else
            CONTAINER_STATUS="failed"
            REGISTRY_STATUS="failed"
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            -X POST "$APP_URL/api/pipeline/status" \
            -H "Authorization: Bearer $PIPELINE_STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"stages\":[\"done\",\"$CONTAINER_STATUS\",\"done\",\"$REGISTRY_STATUS\",\"pending\"]}"

      - name: Trigger Render deployment
        id: trigger_render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --output /dev/null \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for deployment health check
        id: health_check
        env:
          APP_URL: https://cicd-pipeline-app-u7ov.onrender.com
        run: |
          echo "Waiting for Render to deploy and respond..."

          sleep 15

          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "$APP_URL/health"; then
              echo
              echo "Health check passed."
              exit 0
            fi

            echo "Attempt $i/30 failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Deployment health check failed."
          exit 1

      - name: Mark all pipeline stages complete
        if: steps.health_check.outcome == 'success'
        env:
          PIPELINE_STATUS_TOKEN: ${{ secrets.PIPELINE_STATUS_TOKEN }}
          APP_URL: https://cicd-pipeline-app-u7ov.onrender.com
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            -X POST "$APP_URL/api/pipeline/status" \
            -H "Authorization: Bearer $PIPELINE_STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"stages":["done","done","done","done","done"]}'

      - name: Mark cloud deployment as failed
        if: steps.health_check.outcome == 'failure'
        env:
          PIPELINE_STATUS_TOKEN: ${{ secrets.PIPELINE_STATUS_TOKEN }}
          APP_URL: https://cicd-pipeline-app-u7ov.onrender.com
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            -X POST "$APP_URL/api/pipeline/status" \
            -H "Authorization: Bearer $PIPELINE_STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"stages":["done","done","done","done","failed"]}'
```
